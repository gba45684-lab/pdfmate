version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors that need a deliberate migration (and a matching eslint-config-next / Node 22 runtime), not an automatic PR.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/worker"
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: "/worker"
    schedule: {interval: weekly}
    ignore:
      # Stay on the Node 22 LTS image; odd-numbered Node releases (23, 25) are not long-term support.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly}
