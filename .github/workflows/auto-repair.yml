name: PDFMate Auto Repair
on:
  workflow_run:
    workflows: ["PDFMate CI"]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  repair:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Auto-fix ESLint issues
        run: npx eslint . --fix
      - name: Verify
        run: |
          npm run lint
          npm test
          npm run build
      - name: Commit repaired code
        run: |
          if git diff --quiet; then
            echo "No automatic repair available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: auto-repair CI failures"
          git push origin main
