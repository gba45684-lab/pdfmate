name: PDFMate E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System tools (qpdf, poppler, LibreOffice, fonts)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qpdf poppler-utils libreoffice-writer fonts-dejavu-core
      - name: Playwright
        run: pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: npm ci
      - run: npm ci --prefix worker
      - name: Browser suites (menus, back button, all 23 tools, OCR offline, cloud UI, API routes, direct upload)
        run: bash e2e/run_all.sh all
