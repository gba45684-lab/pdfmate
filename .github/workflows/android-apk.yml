name: PDFMate Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor
        run: npm install --no-save --ignore-scripts @capacitor/core@7.4.4 @capacitor/cli@7.4.4 @capacitor/android@7.4.4

      - name: Create Capacitor Android wrapper
        run: |
          rm -rf android
          mkdir -p public
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from "@capacitor/cli";

          const config: CapacitorConfig = {
            appId: "com.pdfmate.app",
            appName: "PDFMate",
            webDir: "public",
            server: {
              url: "https://pdfmate-flax.vercel.app/",
              cleartext: false
            },
            android: {
              backgroundColor: "#f6f7fb"
            }
          };

          export default config;
          EOF
          npx cap add android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDFMate-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
